<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lift"><meta name="theme-color" content="#0b0f14">
<title>Lift Tracker</title>
<style>
:root{--bg:#0b0f14;--card:#141a22;--card2:#0e131a;--bd:#232c38;--tx:#eef2f6;--mu:#8793a3;--ac:#34d399;--acx:#06281c;--rd:#f87171;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f3f5f8;--card:#fff;--card2:#f0f3f7;--bd:#dde3ea;--tx:#111827;--mu:#5d6b7c;--ac:#059669;--acx:#fff;--rd:#dc2626}}
:root[data-theme="dark"]{--bg:#0b0f14;--card:#141a22;--card2:#0e131a;--bd:#232c38;--tx:#eef2f6;--mu:#8793a3;--ac:#34d399;--acx:#06281c;--rd:#f87171}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;padding-bottom:calc(150px + env(safe-area-inset-bottom,0px));overscroll-behavior-y:none}
main{max-width:640px;margin:0 auto;padding:14px}
h1{font-size:26px;margin:6px 0 2px}h2{font-size:18px;margin:18px 0 8px}
.mu{color:var(--mu);font-size:13px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin:12px 0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--mu);padding:8px 14px;border-radius:99px;font-size:14px;font-weight:600}
.chip.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.chip.nx:not(.on){border-color:var(--ac);color:var(--ac)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:var(--tx);background:var(--card2);border:1px solid var(--bd);border-radius:10px;padding:10px;width:100%;min-width:0;font-size:16px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:-1px}
.nm{background:none;border:0;border-bottom:1px solid var(--bd);border-radius:0;padding:4px 0;font-weight:700;font-size:17px}
.ex-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ex-t{font-weight:700;font-size:17px}
.last{font-size:13px;color:var(--mu);margin:2px 0 10px}
.row{display:grid;grid-template-columns:28px 1fr 1fr 46px 30px;gap:8px;align-items:center;margin:6px 0}
.row .n{color:var(--mu);font-weight:700;text-align:center}
.row input{text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.hd{display:grid;grid-template-columns:28px 1fr 1fr 46px 30px;gap:8px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);text-align:center}
.ck{height:42px;border-radius:10px;border:1px solid var(--bd);background:var(--card2);font-size:18px;color:var(--mu)}
.ck.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.x{color:var(--mu);font-size:18px;padding:4px}
.btn{width:100%;padding:14px;border-radius:12px;background:var(--card2);border:1px solid var(--bd);font-weight:600;margin-top:8px}
.btn.p{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:700}
.btn.d{color:var(--rd)}
.sm{padding:8px 12px;width:auto;margin:0}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:30}
.tabs button{flex:1;padding:10px 0 8px;font-size:11px;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button span{font-size:20px}.tabs button.on{color:var(--ac)}
#fin{position:fixed;left:14px;right:14px;bottom:calc(68px + env(safe-area-inset-bottom,0px));max-width:612px;margin:0 auto;z-index:20}
#rest{position:fixed;left:14px;right:14px;bottom:calc(128px + env(safe-area-inset-bottom,0px));max-width:612px;margin:0 auto;background:var(--ac);color:var(--acx);border-radius:14px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;font-weight:700;z-index:25}
#rest[hidden]{display:none}
#rest button{background:rgba(0,0,0,.18);border-radius:8px;padding:6px 10px;font-weight:700;margin-left:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.st{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;text-align:center}
.st b{display:block;font-size:22px;color:var(--ac)}
.hl{display:flex;justify-content:space-between;font-size:14px;padding:3px 0;gap:10px}
.hl span:last-child{font-variant-numeric:tabular-nums;color:var(--mu);text-align:right}
.pr{background:var(--ac);color:var(--acx);font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;margin-left:6px}
.tag{display:flex;gap:8px;margin:6px 0;align-items:center}
.tag select{flex:1}
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--ac);color:var(--acx);padding:10px 16px;border-radius:12px;font-weight:700;z-index:50;max-width:92%;text-align:center}
#toast[hidden]{display:none}
svg{width:100%;height:auto}
</style></head><body>
<div id="toast" hidden></div>
<main id="app"></main>
<div id="rest" hidden><span id="rt">Rest 0:00</span><span><button data-a="rp">+15s</button><button data-a="rs">Skip</button></span></div>
<div id="fin" hidden><button class="btn p" data-a="fin">Finish workout</button></div>
<nav class="tabs">
<button data-a="tab" data-v="log"><span>🏋️</span>Workout</button>
<button data-a="tab" data-v="his"><span>🗓️</span>History</button>
<button data-a="tab" data-v="pro"><span>📈</span>Progress</button>
<button data-a="tab" data-v="set"><span>⚙️</span>Settings</button>
</nav>
<script>
const KEY='lift_v1',$=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DEF={'Push A':['Flat Barbell Bench Press','Incline Dumbbell Press (30°)','Standing Dumbbell Lateral Raise','Cable Chest Flye (Mid-Height)','Tricep Rope Pushdown'],
'Pull A':['Barbell Bent-Over Row','Neutral-Grip Lat Pulldown','Chest-Supported T-Bar / Machine Row','Face Pulls (Rope)','Barbell or EZ-Bar Bicep Curl'],
'Legs A':['Barbell Back Squat','Romanian Deadlift (Dumbbell or Barbell)','Leg Press (Feet Low & Shoulder-Width)','Seated Leg Curl','Standing Calf Raise'],
'Abs & Arms':['Incline Dumbbell Curl','Overhead Cable Tricep Extension','Dumbbell Hammer Curl','Dumbbell / EZ-Bar Skull Crushers','Hanging Leg / Knee Raises','Cable Woodchoppers or Pallof Press','Decline Bench Weighted Crunch'],
'Push B':['Seated Overhead Dumbbell Press','Incline Machine Press or Smith Press','Low-to-High Cable Flye','Cable Lateral Raise (Behind Back or Cuff)','Bodyweight Dips (or Weighted / Assisted)'],
'Pull B':['Conventional Deadlift or Rack Pull','Single-Arm Dumbbell Row','Wide-Grip Cable Seated Row','Straight-Arm Cable Lat Pushdown','Incline Dumbbell Rear Delt Flye'],
'Legs B':['Barbell Romanian Deadlift (RDL)','Hack Squat or Pendulum Squat','Bulgarian Split Squat (Dumbbell)','Lying Leg Curl','Seated Calf Raise']};
let mem=null;
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.routines)return d}catch(e){}
return {routines:JSON.parse(JSON.stringify(DEF)),order:['Push A','Pull A','Legs A','Abs & Arms','Push B','Pull B','Legs B'],logs:[],next:0,draft:{},unit:'kg',rest:90}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){mem=S}}
let S=load(),tab='log',cur=S.order[S.next]||Object.keys(S.routines)[0],edit=false,pe='',tEnd=0,tDone=0,msg='';
const R=()=>S.routines[cur]||(S.routines[cur]=[]);
function last(n){for(let i=S.logs.length-1;i>=0;i--){const e=S.logs[i].ex.find(x=>x.name===n);if(e)return{sets:e.sets,date:S.logs[i].date}}return null}
function ph(n,j){const l=last(n),s=l&&(l.sets[j]||l.sets[l.sets.length-1]);return s?{w:s.w,r:s.r}:{w:'',r:''}}
function D(){const d=S.draft[cur]||(S.draft[cur]=[]);R().forEach((n,i)=>{if(!d[i]){const l=last(n),c=l?l.sets.length:3;d[i]=Array.from({length:c},()=>({w:'',r:'',d:0}))}});d.length=R().length;return d}
const fd=d=>new Date(d).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});
const fs=s=>s.map(x=>x.w+'×'+x.r).join(', ');
const e1=(w,r)=>w*(1+r/30);
function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,3500)}
function render(){
 document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===tab));
 $('#fin').hidden=tab!=='log'||edit;
 $('#app').innerHTML=({log:vLog,his:vHis,pro:vPro,set:vSet})[tab]();
}
function vLog(){
 const d=D(),u=S.unit,nx=S.order[S.next];
 let h=`<h1>${esc(cur)}</h1><div class="mu">${cur===nx?'Up next in your cycle':'Next in cycle: '+esc(nx||'-')} · tap a day to switch</div>
 <div class="chips">${S.order.map((r,i)=>`<button class="chip ${r===cur?'on':''} ${i===S.next?'nx':''}" data-a="pick" data-v="${esc(r)}">${i+1}. ${esc(r)}</button>`).join('')}</div>`;
 R().forEach((n,i)=>{const l=last(n);
  h+=`<div class="card"><div class="ex-h">${edit?`<input class="nm" data-k="name" data-i="${i}" value="${esc(n)}">`:`<div class="ex-t">${esc(n)}</div>`}
  ${edit?`<span style="white-space:nowrap"><button class="x" data-a="up" data-i="${i}">↑</button><button class="x" data-a="dn" data-i="${i}">↓</button><button class="x" data-a="del" data-i="${i}" style="color:var(--rd)">✕</button></span>`:''}</div>
  <div class="last">${l?`Last (${fd(l.date)}): ${fs(l.sets)} ${u}`:'No previous data yet'}</div>
  <div class="hd"><span>Set</span><span>${u}</span><span>Reps</span><span></span><span></span></div>`;
  d[i].forEach((s,j)=>{const p=ph(n,j);
   h+=`<div class="row"><span class="n">${j+1}</span>
   <input inputmode="decimal" data-k="w" data-i="${i}" data-j="${j}" value="${esc(s.w)}" placeholder="${p.w||'-'}">
   <input inputmode="numeric" data-k="r" data-i="${i}" data-j="${j}" value="${esc(s.r)}" placeholder="${p.r||'-'}">
   <button class="ck ${s.d?'on':''}" data-a="chk" data-i="${i}" data-j="${j}">✓</button>
   <button class="x" data-a="dset" data-i="${i}" data-j="${j}">−</button></div>`});
  h+=`<button class="btn sm" data-a="aset" data-i="${i}">+ Add set</button></div>`});
 h+=`<button class="btn" data-a="aex">+ Add exercise</button><button class="btn" data-a="edit">${edit?'Done editing':'✎ Edit / reorder exercises'}</button>`;
 return h}
function vHis(){
 let h='<h1>History</h1>';
 if(!S.logs.length)return h+'<div class="card mu">No workouts saved yet. Finish a workout and it appears here.</div>';
 [...S.logs].reverse().forEach(g=>{const vol=g.ex.reduce((a,e)=>a+e.sets.reduce((b,s)=>b+s.w*s.r,0),0);
  h+=`<div class="card"><div class="ex-h"><div><div class="ex-t">${esc(g.routine)}</div><div class="mu">${fd(g.date)} · volume ${Math.round(vol)} ${S.unit}</div></div><button class="x" data-a="dlog" data-v="${g.id}">🗑</button></div><div style="margin-top:8px">`+
  g.ex.map(e=>`<div class="hl"><span>${esc(e.name)}${e.pr?'<span class="pr">PR</span>':''}</span><span>${fs(e.sets)}</span></div>`).join('')+'</div></div>'});
 return h}
function vPro(){
 const now=new Date(),wk=new Date(now);wk.setHours(0,0,0,0);wk.setDate(wk.getDate()-((wk.getDay()+6)%7));
 const tw=S.logs.filter(g=>new Date(g.date)>=wk).length;
 const vol=S.logs.reduce((a,g)=>a+g.ex.reduce((b,e)=>b+e.sets.reduce((c,s)=>c+s.w*s.r,0),0),0);
 let h=`<h1>Progress</h1><div class="stats"><div class="st"><b>${S.logs.length}</b><span class="mu">workouts</span></div><div class="st"><b>${tw}</b><span class="mu">this week</span></div><div class="st"><b>${vol>=1000?(vol/1000).toFixed(1)+'k':Math.round(vol)}</b><span class="mu">total ${S.unit}</span></div></div>`;
 const names=[...new Set(S.logs.flatMap(g=>g.ex.map(e=>e.name)))].sort();
 if(!names.length)return h+'<div class="card mu">Log a workout to see exercise charts.</div>';
 if(!names.includes(pe))pe=names[0];
 const pts=S.logs.map(g=>{const e=g.ex.find(x=>x.name===pe);return e&&{d:g.date,w:Math.max(...e.sets.map(s=>s.w)),e:Math.max(...e.sets.map(s=>e1(s.w,s.r)))}}).filter(Boolean);
 h+=`<h2>Exercise</h2><select data-k="pe">${names.map(n=>`<option ${n===pe?'selected':''}>${esc(n)}</option>`).join('')}</select>`;
 const best=Math.max(...pts.map(p=>p.w)),be=Math.max(...pts.map(p=>p.e));
 h+=`<div class="stats" style="margin-top:12px"><div class="st"><b>${best}</b><span class="mu">best ${S.unit}</span></div><div class="st"><b>${be.toFixed(1)}</b><span class="mu">est. 1RM</span></div><div class="st"><b>${pts.length}</b><span class="mu">sessions</span></div></div>`;
 if(pts.length>1){const W=320,H=150,p=24,mn=Math.min(...pts.map(x=>x.e)),mx=Math.max(...pts.map(x=>x.e)),rg=(mx-mn)||1;
  const xy=pts.map((x,i)=>[p+i*(W-2*p)/(pts.length-1),H-p-(x.e-mn)/rg*(H-2*p)]);
  h+=`<div class="card"><div class="mu">Estimated 1RM per session</div><svg viewBox="0 0 ${W} ${H}"><polyline fill="none" stroke="var(--ac)" stroke-width="2.5" stroke-linejoin="round" points="${xy.map(a=>a.join(',')).join(' ')}"/>${xy.map(a=>`<circle cx="${a[0]}" cy="${a[1]}" r="4" fill="var(--ac)"/>`).join('')}<text x="4" y="14" fill="var(--mu)" font-size="11">${mx.toFixed(0)}</text><text x="4" y="${H-8}" fill="var(--mu)" font-size="11">${mn.toFixed(0)}</text></svg></div>`}
 else h+='<div class="card mu">Log this exercise at least twice to see a trend line.</div>';
 return h}
function vSet(){
 let h=`<h1>Settings</h1><div class="card"><div class="ex-t">Weekly cycle</div><div class="mu">Runs in order and repeats. Finishing a workout moves you to the next slot.</div>`;
 S.order.forEach((r,i)=>{h+=`<div class="tag"><span class="mu">${i+1}</span><select data-k="slot" data-i="${i}">${Object.keys(S.routines).map(n=>`<option ${n===r?'selected':''}>${esc(n)}</option>`).join('')}</select><button class="x" data-a="dslot" data-i="${i}">✕</button></div>`});
 h+=`<button class="btn sm" data-a="aslot">+ Add slot</button></div>
 <div class="card"><div class="ex-t">New routine</div><div class="tag"><input id="nr" placeholder="e.g. Shoulders"><button class="btn sm p" data-a="nr">Add</button></div></div>
 <div class="card"><div class="ex-t">Preferences</div>
 <div class="tag"><span class="mu" style="width:90px">Unit label</span><select data-k="unit"><option ${S.unit==='kg'?'selected':''}>kg</option><option ${S.unit==='lb'?'selected':''}>lb</option></select></div>
 <div class="tag"><span class="mu" style="width:90px">Rest (sec)</span><input inputmode="numeric" data-k="rest" value="${S.rest}"></div></div>
 <div class="card"><div class="ex-t">Backup</div><div class="mu">Your data lives only on this device. Copy this text somewhere safe, or paste a backup and tap Restore.</div>
 <textarea id="bk" rows="5" style="margin-top:8px">${esc(JSON.stringify(S))}</textarea>
 <button class="btn" data-a="copy">Copy backup</button><button class="btn" data-a="restore">Restore from pasted text</button><button class="btn d" data-a="reset">Erase everything</button></div>`;
 return h}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,i=+b.dataset.i,j=+b.dataset.j,v=b.dataset.v;
 if(a==='tab'){tab=v;edit=false;scrollTo(0,0)}
 else if(a==='pick'){cur=v;edit=false}
 else if(a==='edit')edit=!edit;
 else if(a==='aex'){R().push('New exercise');D()}
 else if(a==='del'){R().splice(i,1);S.draft[cur]&&S.draft[cur].splice(i,1)}
 else if(a==='up'||a==='dn'){const k=a==='up'?i-1:i+1;if(k<0||k>=R().length)return;const d=D();[R()[i],R()[k]]=[R()[k],R()[i]];[d[i],d[k]]=[d[k],d[i]]}
 else if(a==='aset'){const d=D();d[i].push({w:'',r:'',d:0})}
 else if(a==='dset'){const d=D();if(d[i].length>1)d[i].splice(j,1)}
 else if(a==='chk'){const s=D()[i][j];s.d=s.d?0:1;if(s.d){const p=ph(R()[i],j);if(s.w==='')s.w=p.w;if(s.r==='')s.r=p.r;tEnd=Date.now()+S.rest*1000;tDone=0}}
 else if(a==='rp')tEnd=Math.max(tEnd,Date.now())+15000;
 else if(a==='rs')tEnd=0;
 else if(a==='fin')return finish();
 else if(a==='dlog'){if(!confirm('Delete this workout?'))return;S.logs=S.logs.filter(g=>String(g.id)!==v)}
 else if(a==='aslot')S.order.push(Object.keys(S.routines)[0]);
 else if(a==='dslot'){if(S.order.length>1){S.order.splice(i,1);S.next=Math.min(S.next,S.order.length-1)}}
 else if(a==='nr'){const n=$('#nr').value.trim();if(!n||S.routines[n])return;S.routines[n]=[];cur=n;tab='log';edit=true}
 else if(a==='copy'){const t=$('#bk');t.select();try{await navigator.clipboard.writeText(t.value);toast('Copied')}catch(x){document.execCommand('copy');toast('Copied')}return}
 else if(a==='restore'){try{const d=JSON.parse($('#bk').value);if(!d.routines||!d.logs)throw 0;if(!confirm('Replace current data with this backup?'))return;S=d;cur=S.order[S.next]||cur;toast('Restored')}catch(x){return toast('That text is not a valid backup')}}
 else if(a==='reset'){if(!confirm('Erase all workouts and settings?'))return;S=load.call(null,localStorage.removeItem(KEY));cur=S.order[0];S.next=0}
 save();render()});
document.addEventListener('input',e=>{const t=e.target,k=t.dataset.k;if(!k)return;const i=+t.dataset.i,j=+t.dataset.j;
 if(k==='w'||k==='r')D()[i][j][k]=t.value;
 else if(k==='name'){const o=R()[i],n=t.value;R()[i]=n}
 else if(k==='rest')S.rest=Math.max(10,+t.value||90);
 save()});
document.addEventListener('change',e=>{const t=e.target,k=t.dataset.k;if(!k)return;
 if(k==='pe')pe=t.value;else if(k==='slot')S.order[+t.dataset.i]=t.value;else if(k==='unit')S.unit=t.value;else return;
 save();render()});
function finish(){
 const d=D(),ex=[],prs=[];
 R().forEach((n,i)=>{const sets=[];d[i].forEach((s,j)=>{if(s.d||(s.r!==''&&s.r!=null)){const p=ph(n,j),w=parseFloat(s.w===''?p.w:s.w),r=parseInt(s.r===''?p.r:s.r);if(w>=0&&r>0)sets.push({w,r})}});
  if(sets.length){const pm=Math.max(0,...S.logs.flatMap(g=>g.ex.filter(x=>x.name===n).flatMap(x=>x.sets.map(s=>s.w)))),had=!!last(n),pr=had&&Math.max(...sets.map(s=>s.w))>pm;if(pr)prs.push(n);ex.push({name:n,sets,pr})}});
 if(!ex.length)return toast('Enter reps for at least one set first');
 S.logs.push({id:Date.now(),routine:cur,date:new Date().toISOString(),ex});
 delete S.draft[cur];tEnd=0;
 const k=S.order.indexOf(cur);S.next=((k<0?S.next:k)+1)%S.order.length;cur=S.order[S.next];
 save();render();scrollTo(0,0);toast(prs.length?'Saved! 🎉 New PR: '+prs.join(', '):'Workout saved. Next: '+cur)}
setInterval(()=>{const el=$('#rest');if(tEnd){const s=Math.ceil((tEnd-Date.now())/1000);if(s>0){el.hidden=false;$('#rt').textContent='Rest '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}else{tEnd=0;tDone=Date.now()+3000;$('#rt').textContent='Rest over — go!';try{navigator.vibrate&&navigator.vibrate(300)}catch(x){}}}
 else if(tDone&&Date.now()>tDone){tDone=0;el.hidden=true}
 else if(!tDone)el.hidden=true},500);
render();
</script></body></html>
